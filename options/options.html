<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CroissantStrike — Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0e0e10; color: #fff; padding: 24px; max-width: 480px; }
    h1 { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #2596be; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #555; margin-bottom: 24px; }
    h2 { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .section { margin-bottom: 24px; }
    label { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; font-size: 12px; border-bottom: 1px solid #1a1a1a; }
    label:last-child { border-bottom: none; }
    input[type="checkbox"] { accent-color: #2596be; width: 14px; height: 14px; }
    .save-btn { background: #2596be; color: #fff; border: none; border-radius: 6px; padding: 8px 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .save-btn:hover { background: #1d7da0; }
    #saved-msg { color: #2596be; font-size: 11px; margin-top: 8px; opacity: 0; transition: opacity .3s; }
    #saved-msg.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>🥐 CROISSANTSTRIKE</h1>
  <p class="subtitle">Filtres du calendrier</p>
  <div class="section">
    <h2>Tournois à afficher</h2>
    <label><input type="checkbox" data-key="esl" checked> ESL Pro League</label>
    <label><input type="checkbox" data-key="blast" checked> Blast Premier</label>
    <label><input type="checkbox" data-key="iem" checked> IEM (Intel Extreme Masters)</label>
    <label><input type="checkbox" data-key="major" checked> CS Majors</label>
    <label><input type="checkbox" data-key="other"> Autres tournois</label>
  </div>
  <button class="save-btn">Enregistrer</button>
  <div id="saved-msg">✓ Sauvegardé</div>
  <script src="options.js"></script>
</body>
</html>
